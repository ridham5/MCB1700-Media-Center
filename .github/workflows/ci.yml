name: tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: make -C host test
      - name: Check the firmware compiles as C89 with every option on
        run: |
          for f in main gallery tetris snake audio highscore profile; do
            gcc -std=c89 -pedantic -Wall -Werror -Wno-long-long -Ihost/stubs -Isrc -DPROFILE -DHIGHSCORES -fsyntax-only src/$f.c
          done
          for f in main audio; do
            gcc -std=c89 -pedantic -Wall -Werror -Wno-long-long -Ihost/stubs -Isrc -DUSE_RTX -DHIGHSCORES -fsyntax-only src/$f.c
          done
